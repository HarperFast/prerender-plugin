# Prerender plugin schema.
#
# Tables are grouped into databases by write-transaction coupling. Harper serializes
# writes per database and commits each database independently, so the hot,
# high-frequency queue table is isolated in its own database; tables that don't need
# cross-table atomic writes live apart to maximize write concurrency.
#
#   render_schedule  RenderSchedule                  — the hot render queue (isolated)
#   render_service   Target, QueueStatus,            — URL registry (incl. indexability
#                    QueueControl                      verdicts) + queue status + pause intent
#   config           ConfigOverride                  — operator-set config overrides (isolated
#                                                      because it is SUBSCRIBED; see the type)
#   page_cache       PrerenderedPage                 — rendered-HTML cache (blob writes)
#   sitemaps         Sitemap, SitemapRefresh         — sitemap data
#   coordination     SharedBuffer,                   — node-local SAB, never replicated
#                    CoordinationAnchor                (+ an empty replicated anchor, see the type)
#   probe_state      ProbeState, ProbeStateAnchor    — change-probe baselines (node-local,
#                                                      isolated for reseed write bursts)
#   invalidation     Invalidation                    — bulk-invalidation epochs (read on the
#                                                      serve path; isolated, see the type)

type SitemapEntry {
	loc: String
	lastmod: String
	changefreq: String
	priority: Float
}

type Sitemap @table(database: "sitemaps") {
	url: String @primaryKey
	isIndex: Boolean
	entryCount: Int
	entries: [SitemapEntry]
	lastRefreshed: Date
	# The index that listed this sitemap, or null for one added directly.
	#
	# Every document reached during a walk gets its own row, children included, so without this
	# a "refresh everything" pass walked each child TWICE: once by descending the index, then
	# again as a top-level row in its own right. At index scale that is double the fetches,
	# double the point reads and double the writes, every single pass. Refresh-all now visits
	# roots only and lets the index reach its own children.
	parentUrl: String @indexed
}

type SitemapFailure {
	url: String
	error: String
}

# Progress and outcome for one sitemap walk.
#
# Two kinds of row share this table:
#   'all'        — written by the daily scheduler when a full pass finishes (`lastRefreshed`).
#   <root url>   — one per root sitemap, rewritten as that walk progresses.
#
# The per-root rows exist because a real sitemap index is not an HTTP-request-sized unit of
# work: the walk runs in the background and this row is the only way to see where it got to,
# whether any child failed, and whether it is still alive (`updatedAt`).
type SitemapRefresh @table(database: "sitemaps") @export(name: "sitemap_refresh") {
	id: Any @primaryKey
	lastRefreshed: Date
	# running | completed | failed
	state: String
	node: String
	startedAt: Date
	# Bumped after every child sitemap, so a stalled walk is distinguishable from a slow one.
	updatedAt: Date
	finishedAt: Date
	sitemapsProcessed: Int
	sitemapsDiscovered: Int
	created: Int
	updated: Int
	skipped: Int
	# Entries an earlier sitemap in the same walk already owned (overlapping sitemaps).
	duplicates: Int
	deferred: Int
	removed: Int
	# Children that threw. The walk continues past them rather than aborting.
	failed: [SitemapFailure]
	# Set only when the walk itself aborted (the root sitemap could not be fetched or parsed).
	error: String
}

# The registry of URLs in the render rotation — ONE row per URL. Device variants are not
# stored: the set of devices a URL renders for is `config.deviceTypes.default` at write time,
# and `Target.put` fans out one RenderSchedule row per device (RenderSchedule and
# PrerenderedPage stay cacheKey-keyed — the queue and the content are genuinely per-device;
# only the registry is per-URL).
#
# `state: suppressed` is the render-verdict memory that used to live in the NonIndexable
# table: a render proved the page non-indexable, so discovery must not keep re-creating the
# target. A suppressed target keeps its schedule at `render.suppression.recheckInterval` —
# the schedule IS the TTL — so the verdict re-proves (or heals) itself on cadence, and
# `strikes` consecutive non-indexable verdicts delete the row outright.
type Target @table(database: "render_service") @export {
	url: String @primaryKey
	sitemapUrl: String @indexed
	schedulerNode: String
	renderInterval: Long
	# 'suppressed', or absent/null for a target in normal rotation.
	state: String @indexed
	# Why the last verdict suppressed it: noindex | canonical-mismatch | redirect-loop | ...
	suppressedReason: String
	suppressedAt: Date
	# Consecutive non-indexable verdicts; render.suppression.maxStrikes deletes the target.
	strikes: Int
	# Current demand-ladder rung (ms), when render.demand is enabled. Absent = the target has
	# never been evaluated and starts from its route/stored interval. Written ONLY when the rung
	# actually changes, so a converged corpus pays no write — same discipline as `strikes`.
	demandInterval: Long
}

type RenderSchedule @table(database: "render_schedule") @export {
	cacheKey: String @primaryKey
	nextRenderTime: Long @indexed
	# Denormalized from RenderTarget.sitemapUrl so `claim` doesn't need a per-job
	# cross-database read just to flag sitemap-sourced jobs. Refreshed on every
	# reschedule (job result), so it self-corrects when a URL leaves its sitemap.
	fromSitemap: Boolean
	# The page's CADENCE in ms — route > stored > default with the demand ladder's rung applied
	# (`resolveEffectiveInterval`). How often this page should render, which is NOT the same as the
	# gap `nextRenderTime` was actually written with: a suppression recheck files 7 days out and a
	# failure backoff files its backoff, and neither is a cadence. The distinction is the whole
	# reason `util/renderPriority.js` scores lateness rather than age — the numerator is how far
	# past due the row is, the denominator is how often it wants to render. Writers file the
	# cadence here even when the gap they wrote differs. Denormalized for the same reason
	# `fromSitemap` is: the ready-set sweep scores every due row on the node by lateness RELATIVE
	# TO CADENCE, and recovering that per row from RenderTarget would be a cross-database point
	# read per row over the whole due set — on a residency-pinned table, ~75% of them replication
	# fetches. NOT @indexed: it is only ever read alongside a row already selected by
	# `nextRenderTime`, and a second index costs ~13% on every write (bench/queue-index).
	#
	# Absent is legal and self-healing — pre-upgrade rows, and the writers that genuinely have no
	# cadence in hand (a render-now one-off) — and the sweep falls back to resolving from config,
	# which is what it did before this field existed. Every row re-renders on its own cadence, so
	# the active corpus fills in within one cycle.
	effectiveInterval: Long
}

type QueueStatus @table(database: "render_service") @sealed @export(name: "queue_status") {
	hostname: String @primaryKey
	# Queue status (empty, queued, or paused)
	status: String
	updatedTime: Date @updatedTime
}

# Desired pause state — the *intent*, as opposed to QueueStatus's *observed* status.
#
# QueueStatus can't carry this: a node owns the row keyed by its own hostname and rewrites it
# whenever its status changes, so an intent written there by another node would be clobbered.
# (It rewrites on a CHANGE, not on every sync — `reportStatus` guards the write behind a
# compareExchange on a node-local shared buffer so the per-request and per-claim-pass callers
# never turn into replicated writes. `updatedTime` therefore means "status last changed", and
# nothing should read it as a heartbeat.) This table is replicated
# (the default), so a write on any node reaches every node, and each node's periodic
# refreshQueueStatus resolves it onto its local (non-replicated) queue-state flag.
#
#   scope 'all'      — cluster-wide default
#   scope <hostname> — per-node override; `paused: false` explicitly runs a node even
#                      while 'all' is paused. Delete the row to inherit 'all' again.
type QueueControl @table(database: "render_service") @sealed @export(name: "queue_control") {
	scope: String @primaryKey
	paused: Boolean
	updatedTime: Date @updatedTime
	updatedBy: String
}

# Operator-set config overrides — the layer between the deployed `config.yaml` and the running config.
#
# Config resolves in three layers, lowest precedence first:
#
#   schema defaults  <  config.yaml (git-deployed)  <  these rows (set from the console)
#
# ONE ROW PER OPTION PATH, HOLDING A DELTA — never a snapshot of the whole config. A snapshot would
# freeze every option an operator ever touched against future deploys: ship a corrected default or a
# fixed route and the stale snapshot silently shadows it, with nothing to indicate why the deploy did
# nothing. One row per path means a `config.yaml` change still takes effect for every path nobody
# pinned, deleting a row reverts that path to the deployed value, and deleting every row returns the
# cluster to exactly its deployed state — which is the whole rollback story.
#
# ALONE IN ITS OWN DATABASE, AND THAT IS THE POINT — this table is SUBSCRIBED, and a subscription is
# a per-database cost, not a per-table one. Harper's audit log spans every table in a database (each
# reader filters on `auditRecord.tableId`), so `addSubscription` attaches its `committed` listener to
# the DATABASE's audit store and every commit there schedules a pass that iterates the transaction
# log. In `render_service` that would mean every Target and QueueStatus write paying for a
# subscription to a table nobody writes — on every worker, since every worker subscribes — which is
# the same rocksdb txn-log iteration that has pegged worker threads here before.
#
# Write serialization says the same thing from the other side: Harper serializes writes per database,
# so a config write would queue behind whatever the URL registry is doing, and a burst of Target
# writes would sit behind a config write. Neither table needs the other to be atomic with it.
#
# The cost of a separate database is one more replication stream. It carries a replicable table, so
# it is not the empty-database case that spins on subscribe/retry.
#
# Replicated (the default) and deliberately NOT residency-pinned, so the console writes ONCE on
# whichever node it reached and every node converges. The alternative — the console fanning a write
# out to N nodes — has no convergence: a node that was mid-restart for one write would diverge
# permanently, and config divergence is the one thing this cluster treats as a deploy failure rather
# than a preference (see the Config view in @harperfast/prerender-console). Reads are bounded and pass
# `replicateFrom: false` (util/configOverride.js).
#
# NOT `@export`ed, unlike QueueControl. The management API is the write path because it is what
# validates the path against the schema, type-checks the value, records who set it, and can preview
# the change; a bare REST PUT would happily store a row that `applyOptions` then rejects at apply
# time, which shows up as an override the console lists but the cluster does not honor. The
# operations API (`insert`/`delete` on `config.ConfigOverride`) remains available as the
# break-glass path, and `management.overrides.enabled: false` in the config file is the kill switch
# that makes this whole layer inert without deleting anything.
type ConfigOverride @table(database: "config") @sealed {
	# Dotted option path exactly as it appears in configSchema.js (e.g. `queue.jobLeaseTime`).
	# Validated against the schema before the row is written, so an unknown, secret, or
	# non-UI-editable path never lands. A path that MOVES in a later release is remapped through the
	# schema's `movedFrom` aliases on apply, exactly like a legacy path in config.yaml.
	path: String @primaryKey

	# `Any`, so a number stays a number and a boolean stays a boolean. The merge in config.js
	# type-checks each override against its schema default, so a stringified "3600000" is rejected
	# rather than coerced — storing everything as text would turn every option into a parse.
	value: Any

	updatedTime: Date @updatedTime
	updatedBy: String

	# Why this override exists. It outlives the operator who set it, and an unexplained override that
	# contradicts the deployed file is precisely the row the next person cannot safely revert.
	note: String
}

# Bulk cache invalidation. "Everything of this kind is wrong as of now; stop serving it."
#
# ONE ROW PER SCOPE, and replicated (the default): a write on any node reaches all of them, and two
# operators invalidating different scopes never collide — a single aggregate row would lose one of
# them to last-write-wins.
#
# The mechanism is a COMPARISON, not a rewrite. Nothing in PrerenderedPage or RenderSchedule is
# touched: the serve path asks "was this page rendered before the epoch?" and demotes it if so.
# Measured against the alternative of rewriting the corpus (400k rows, one node's slice):
# 15.7 s and 61.8 MB of audit per node per invalidation, versus 0.18 ms and 102 bytes here —
# ~606,000x less audit. It also makes undo instant, because `lastCached` was never altered.
#
# ITS OWN DATABASE, for two measured reasons. Harper serializes writes per database, and (a) a bulk
# write to another table in the same database pushed tiny-table read p99 from 0.24 ms to 9.7 ms
# (max 13.9 ms) — and this table is read ON THE SERVE PATH; (b) `Target.revalidate` and the queue
# both write `render_service`, so a scope row there would queue behind those commits.
#
# DELIBERATELY NOT @export. A REST write verb here takes the whole corpus off the serve path in one
# request, and a bare PUT cannot enforce any of the validation that makes a scope meaningful — the
# same reasoning that keeps CrawlSketch unexported. `PrerenderAdmin` is the only authenticated write
# surface in this plugin, so it is the only door.
type Invalidation @table(database: "invalidation") @sealed {
	# 'all' | 'route:<match>:<path>' naming one compiled prerender route (util/routeClass.js
	# `routeScopeOf`). COMPARED, never parsed — a path may contain a colon. The route list is the
	# scope axis because it is the only closed, already-compiled partition of the corpus available:
	# an unvalidatable scope records a row that looks applied and matches nothing, which is the worst
	# failure this feature has, because the operator's mitigation appears to have worked.
	scope: String @primaryKey

	# THE EPOCH. A cached page whose `lastCached` is not strictly greater than
	# (`invalidatedAt` + `invalidation.pad`) is not servable.
	#
	# Explicit, and NEVER @updatedTime. @updatedTime re-stamps on every write, so correcting a typo
	# in `reason` would silently re-invalidate the entire scope. For the same reason there is no
	# "fall back to updatedTime when this is missing" rule: a hand-written row (the operations-socket
	# escape hatch) has a re-stamped updatedTime, so the fallback would reintroduce exactly the
	# hazard this column exists to avoid. A row lacking it does not apply at all, and is reported.
	invalidatedAt: Date

	# 'hard' only in v1 — stop serving, proxy to the origin until the page re-renders on its normal
	# cadence. The column exists so that adding a 'grace' mode later is an addition, not a migration.
	# A present-but-unrecognised value is treated as 'hard' (the safe direction) and reported.
	mode: String

	# Required by the API, <=200 chars. One sentence of friction against an unexplained red button
	# at 04:00, and the only record of intent that outlives the incident.
	reason: String
	updatedBy: String
	updatedTime: Date @updatedTime
}

# Per-URL proof that a cached page's OWN CLAIMS still match the origin, so a bulk invalidation can
# refuse a page for LACKING EVIDENCE rather than merely for predating the epoch. Written by the
# change probe when `pageCheck` compared the cached page against the origin and they AGREED; read on
# the serve path only for a page an invalidation would otherwise refuse.
#
# WHY THIS IS NOT A FIELD ON PrerenderedPage, where the serve path already holds the row and the read
# would be free. Harper serializes writes per database, and the `Invalidation` comment above records
# the measurement: a bulk write to another table in the same database pushed tiny-table read p99 from
# 0.24 ms to 9.7 ms (max 13.9 ms). `page_cache` is the busiest database here, its commits are the
# largest (they carry blob bodies), and its transaction log is the one measured pegging worker threads
# at 85-95% of CPU in the RocksDB log iterator. A ~200k-per-cycle write stream does not belong in it.
# (A patch does NOT re-stream the blob — the audit stores the delta and `getValue` decodes only that,
# so `HAS_BLOBS` on a patch entry is a false positive. Cheap replication, still the wrong database.)
#
# ITS OWN DATABASE, same two reasons as `Invalidation`: nothing else may queue behind these writes,
# and this table is read ON THE SERVE PATH. Replicated and NOT residency-pinned, deliberately — the
# opposite of `ProbeState`. The probe that writes a row runs on the key's owner, but the request that
# needs it lands wherever the CDN sent it; a node-local table would answer only ~15% of the requests
# that matter (measured: `invalidation_reenqueue{outcome='not-owner'}` is 84-85%).
#
# KEYED BY URL, not cacheKey: the probe's unit is the URL, `triggerRevalidate` hard-expires every
# device key of a URL together, and one row instead of two halves the write volume. The serve path
# derives the URL half with `CacheKey.extractUrl`.
#
# ABSENT ROW = NOT VERIFIED = STAYS INVALIDATED. Every failure here — never probed, probe failed,
# read error, unreadable timestamp — must land on that side, because the alternative is serving a page
# somebody deliberately invalidated. `resolveServeStatus` enforces it with the same `!(a > b)` shape
# the epoch comparison uses, so NaN fails closed.
type PageVerification @table(database: "verification", expiration: 604800) @sealed {
	# The canonical URL half of the cache key (`util/cacheKey.js` `CacheKey.extractUrl`).
	url: String @primaryKey
	# When the probe last confirmed the cached page's claims matched the origin. COMPARED against the
	# invalidation epoch, never displayed as freshness — a verified page is still as old as it was.
	verifiedAt: Date
	# The `lastCached` of the render whose claims were verified (`ProbeState.pageClaimAt`), and what
	# makes a per-URL verification safe for PER-DEVICE pages.
	#
	# `pageSignature` is keyed by url and written by whichever device rendered last, so the evidence
	# is per-URL while the pages are per-cacheKey. On a SPLIT PAIR — a normal state here — desktop
	# could be verified while mobile still holds a pre-change render, and a bare per-URL exemption
	# would serve the stale mobile page. Carrying the basis closes that exactly: the serve path
	# exempts a key only when its OWN `lastCached` is at least this, so the verified render and
	# anything newer qualify and a lagging sibling does not.
	#
	# In the healthy case this costs nothing — `util/time.js` seeds jitter off the URL half precisely
	# so a URL's device variants land on the same minute, so both keys clear the basis and both are
	# exempt. Absent (a row written before this field existed) reads as NaN and exempts nothing.
	basisAt: Date
}

type PrerenderedPage @table(database: "page_cache") @export {
	cacheKey: String @primaryKey
	statusCode: Int!
	headers: String
	content: Blob
	lastCached: Date
	expiresAt: Date
	# Indexability verdict from the render, stored so the serving path can surface it
	# as a debug response header (x-harper-indexable). Optional — older rows lack it.
	isIndexable: Boolean
	# The page's own origin factor k, as the render fleet measured it: same-origin requests the
	# page made beyond the document that no shared cache would have answered (browser ≥ 1.22.0,
	# `subrequests.uncacheable`). Read on the serve path for a crawler that executes scripts and
	# emitted as `hydration_calls` — the origin load its page-view carries, which is either SPARED
	# (snapshot stored without scripts) or INCURRED (scripts kept, or an origin serve). Optional:
	# a row rendered by an older fleet has none, and the serve path reports it as `unknown`.
	uncacheableSubrequests: Int
	# Whether the stored body had its scripts stripped by the render fleet (its
	# postProcess.stripScripts at render time). Decides which side of the ledger k lands on when
	# this row is cache-served. Optional, same vintage as the field above.
	scriptsStripped: Boolean
}

type SharedBuffer @table(database: "coordination", replicate: false) {
	key: Any @primaryKey
}

# DELIBERATELY EMPTY, AND REPLICATED — the anchor that keeps this database subscribable.
#
# Replication subscribes every database (`databases: "*"`), and a database whose tables are all
# `replicate: false` gives that subscription nothing to attach to: the link enters a
# disconnect/retry loop measured at ~4,300 cycles per node per day on this very database
# (harper-pro#685). One replicated table — never written, so it costs zero replication traffic
# and zero storage — turns that loop into an ordinary idle stream. Remove it only once the
# cluster runs a Harper release with that issue fixed.
type CoordinationAnchor @table(database: "coordination") @sealed {
	id: Int @primaryKey
}

# The change probe's last observed content signature per URL (util/changeProbe.js) — canonical
# JSON of the watched fields, compared as an opaque string. Written only when the observation
# differs from what is stored (seed or change), so a converged corpus pays no write per probe.
#
# NODE-LOCAL BY CONSTRUCTION, hence `replicate: false`: the probe sweep is owner-scoped —
# a URL's signature is only ever read and written by the node residency assigns it to — so
# replication would ship every baseline to three nodes that never consult it. The corpus-scale
# seeding pass and every post-trip reseed then cost zero replication and a quarter of the audit.
# The trade is that the state does not survive an ownership move or a node rebuild — and that is
# the safe direction: a missing row re-SEEDS on the next pass (baseline stored, nothing
# triggered).
#
# ITS OWN DATABASE: probe writes are corpus-scale during seeding and post-trip reseeds, and
# Harper serializes writes per database — no other table should queue behind a reseed, and a
# reseed should queue behind nothing. The anchor below is what makes a database of node-local
# tables safe to create at all.
#
# Absent row = never probed (or moved/rebuilt/deleted) — the next probe seeds rather than
# triggers. `Target.delete` removes the row alongside the cached pages.
type ProbeState @table(database: "probe_state", replicate: false) @sealed {
	url: String @primaryKey
	signature: String
	probedAt: Date
	# What the CACHED PAGE claims, written when a render completes (never by the probe), and
	# compared against the endpoint on the next pass. This is what closes ROUND-TRIP BLINDNESS:
	# `signature` only ever answers "did the origin change since I last looked", so a value that
	# changes and changes BACK between two probes is invisible — and if a render landed inside
	# that window, the page keeps the transient value until its interval expires. Measured at
	# ~2.7% of served product pages on one deployment. Kept SEPARATE from `signature` rather than
	# replacing it: the page can only ever express (price, availability), so folding the two would
	# silently narrow drift detection to those fields and stop catching regular/sale price moves.
	# Nullable and inert unless a rule sets `pageCheck.enabled`.
	pageSignature: String
	# The `lastCached` of the render that wrote `pageSignature` — NOT the moment the claim was
	# recorded. Those differ by milliseconds, and the difference is load-bearing: this value is
	# copied onto a verification as the basis it certifies, and a stamp taken a few ms after the page
	# was written would make the very page it certifies fail its own `lastCached >= basisAt` test.
	# Written in the SAME patch as `pageSignature`, so it costs no extra read and no extra write.
	pageClaimAt: Date
}

# Same anchor, same reason as CoordinationAnchor: ProbeState is `replicate: false`, and a
# database with zero replicable tables spins the replication subscription (harper-pro#685).
type ProbeStateAnchor @table(database: "probe_state") @sealed {
	id: Int @primaryKey
}

# One HyperLogLog register array per (UTC day, bot, node) — this node's shard of that day's
# global distinct-URL sketch for that crawler (util/crawlStats.js). Workers merge their
# thread sketches into the node row under the cross-worker mutex; readers merge a day's
# node rows by element-wise max, which reassembles the exact union. Rows replicate
# (default) so any one node can answer for the cluster. Deliberately NOT @export: the raw
# 16 KB shards are only useful merged — reads go through GET /prerender_admin/crawl-breadth,
# behind that resource's super-user gate. Own database: writes are low-frequency and share
# no transaction with any other table.
type CrawlSketch @table(database: "crawl_stats") {
	id: String @primaryKey # `${day}|${bot}|${node}`
	day: String @indexed
	bot: String
	node: String
	registers: Bytes
	# This NODE's own estimate, stored for eyeballing a raw row. Never sum these —
	# distinct counts don't add; merge the node rows and estimate the union.
	estimate: Float
	updatedAt: Date
}

# One ring slice of the bot-visit Bloom filter, per node (`slot|node`) — see util/visitFilter.js.
# Same shape and rationale as CrawlSketch above: per-thread observations merge into one row per
# node, rows replicate so any node can answer, and reads union the node rows for the slots they
# need. Bloom rather than a per-URL `lastVisitedAt` because at search-engine traffic volumes a
# per-URL write lands at roughly the distinct-URL rate against a replicated table; this is one
# merged row per node per flush and constant memory regardless of request volume.
#
# Deliberately NOT @export: raw filter bits are meaningless outside a merge, and membership is
# only ever consumed internally by the demand ladder.
type VisitFilter @table(database: "crawl_stats") {
	id: String @primaryKey # `${slot}|${node}`
	slot: Int @indexed
	node: String
	bits: Bytes
	updatedAt: Date
}
