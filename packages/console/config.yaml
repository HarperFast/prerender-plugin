# Harper component configuration for the prerender console.
#
# This component serves the console UI and proxies its API calls to a prerender deployment's
# /prerender_admin endpoints. Its one table is the proxy's read cache (node-local, not exported —
# see src/schemas/schema.graphql); the data itself all lives on the prerender cluster. Per-deployment
# options (the upstream node list, timeouts, TLS) are supplied by the HOST app under this
# component's key in its own config.yaml — see README.md.

rest: true

graphqlSchema:
  files: 'src/schemas/schema.graphql'

jsResource:
  files: 'src/index.js'

pluginModule: 'extension.js'
